name: build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build:
    runs-on: ubuntu-latest

    # The integration tests exist because the behaviour they cover — two transactions racing
    # for one row, a filtered unique index, a persisted computed column — does not exist in
    # an in-memory provider. Running them against a real SQL Server is the whole point, so
    # CI brings one up rather than skipping them.
    services:
      sql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Your_Strong_Passw0rd"
          MSSQL_PID: Developer
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P Your_Strong_Passw0rd -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/Hubix.Admin/package-lock.json

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Unit tests
        run: dotnet test tests/Hubix.Tests --no-build --configuration Release --verbosity quiet

      - name: Integration tests
        env:
          HUBIX_TEST_SQL: "Server=localhost,1433;Database={0};User Id=sa;Password=Your_Strong_Passw0rd;TrustServerCertificate=True;Encrypt=False"
        run: dotnet test tests/Hubix.IntegrationTests --no-build --configuration Release --verbosity quiet

      # Catches the commit that changes an entity and forgets the migration. Without this the
      # failure surfaces on deploy, as a schema that does not match the code.
      - name: Migrations are up to date
        env:
          HUBIX_TEST_SQL: "Server=localhost,1433;Database={0};User Id=sa;Password=Your_Strong_Passw0rd;TrustServerCertificate=True;Encrypt=False"
          ConnectionStrings__HubixDb: "Server=localhost,1433;Database=HubixCiCheck;User Id=sa;Password=Your_Strong_Passw0rd;TrustServerCertificate=True;Encrypt=False"
        run: |
          dotnet tool install --global dotnet-ef
          export PATH="$PATH:$HOME/.dotnet/tools"
          dotnet ef migrations has-pending-model-changes \
            --project src/Hubix.Infrastructure \
            --startup-project src/Hubix.Web

      # The bundle is what actually gets deployed, and it is generated rather than committed.
      - name: The admin client builds
        run: |
          test -f src/Hubix.Web/wwwroot/admin-assets/index.js
          test -f src/Hubix.Web/wwwroot/admin-assets/index.css

      # Packaged here, from the build that just passed every check above, so what deploys is
      # exactly what was tested.
      - name: Publish
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: dotnet publish src/Hubix.Web --no-build --configuration Release --output publish

      - name: Keep the package
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: web
          path: publish
          retention-days: 7

  # Every merge to main goes live. Pull requests only build and test.
  #
  # Signs in to Azure with OpenID Connect: GitHub vouches for this workflow on this branch, and
  # Azure trusts that for one identity with rights on one resource group. No password or
  # publish profile is stored anywhere. See docs/RUNBOOK.md, "Deploying".
  #
  # Migrations are not applied here. A pull request that adds one has its migration applied
  # by hand before it is merged, as the runbook says.
  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    # One deploy at a time, and a newer merge waits rather than cancelling one half-done.
    concurrency:
      group: deploy-production
      cancel-in-progress: false

    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/download-artifact@v8
        with:
          name: web
          path: publish

      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: azure/webapps-deploy@v3
        with:
          app-name: hubix-dev
          package: publish
          clean: true

      # A deploy that starts an app which then refuses to run is not a deploy. ProductionReadiness
      # throws on unsafe settings, and that shows up here as a failed step rather than as a
      # site nobody has looked at yet.
      - name: The site answers
        run: |
          for attempt in $(seq 1 20); do
            if curl --silent --fail --max-time 30 https://hubix-dev-gng6fjg5d6bvc7hf.germanywestcentral-01.azurewebsites.net/health; then
              exit 0
            fi
            sleep 15
          done
          echo "/health did not answer ok within five minutes of the deploy" >&2
          exit 1
