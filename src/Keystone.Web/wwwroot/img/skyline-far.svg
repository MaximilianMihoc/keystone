    <rect x="284" y="50" width="100" height="70"/>
    <rect x="392" y="10" width="56"  height="110"/>
    <rect x="456" y="34" width="80"  height="86"/>
    <rect x="544" y="24" width="48"  height="96"/>
  </g>
</svg>
